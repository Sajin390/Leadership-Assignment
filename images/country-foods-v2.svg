<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
  <title id="title">Six country food stalls</title>
  <desc id="description">Illustrated plates representing foods from Japan, Bangladesh, Nepal, India, Sri Lanka, and Korea.</desc>
  <defs><linearGradient id="background" x2="1"><stop stop-color="#17352f"/><stop offset="1" stop-color="#2d765f"/></linearGradient><filter id="shadow"><feDropShadow dy="12" stdDeviation="12" flood-opacity=".22"/></filter></defs>
  <rect width="1400" height="760" fill="url(#background)"/>
  <text x="70" y="85" fill="#fffaf0" font-family="Arial" font-size="30" font-weight="800">SIX STALLS · SIX STORIES</text>
  <text x="70" y="125" fill="#bdd9c8" font-family="Arial" font-size="18">Food is the invitation. Conversation is the outcome.</text>
  <g font-family="Arial" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(240 295)"><circle r="145" fill="#fffaf0"/><circle r="110" fill="#f2b544"/><path d="M-55 35L0-70 55 35z" fill="#fff"/><rect x="-65" y="45" width="130" height="22" rx="11" fill="#2d765f"/><text y="190" fill="#fffaf0" font-size="25" font-weight="800">JAPAN</text><text y="220" fill="#bdd9c8" font-size="16">Onigiri &amp; miso</text></g>
    <g transform="translate(700 295)"><circle r="145" fill="#fffaf0"/><circle r="110" fill="#ed6a4b"/><path d="M-75 50Q0-75 75 50z" fill="#f2b544"/><circle cx="-35" cy="0" r="15" fill="#2d765f"/><circle cx="30" cy="-15" r="13" fill="#2d765f"/><text y="190" fill="#fffaf0" font-size="25" font-weight="800">BANGLADESH</text><text y="220" fill="#bdd9c8" font-size="16">Pitha &amp; biryani</text></g>
    <g transform="translate(1160 295)"><circle r="145" fill="#fffaf0"/><circle r="110" fill="#bdd9c8"/><circle cx="-45" cy="5" r="35" fill="#fffaf0"/><circle cx="35" cy="-25" r="35" fill="#fffaf0"/><circle cx="40" cy="50" r="35" fill="#fffaf0"/><text y="190" fill="#fffaf0" font-size="25" font-weight="800">NEPAL</text><text y="220" fill="#bdd9c8" font-size="16">Momo &amp; sel roti</text></g>
    <g transform="translate(390 610)"><circle r="115" fill="#fffaf0"/><circle r="88" fill="#ed6a4b"/><path d="M-60 25h120v38H-60z" fill="#f2b544"/><text y="150" fill="#fffaf0" font-size="23" font-weight="800">INDIA</text></g>
    <g transform="translate(700 610)"><circle r="115" fill="#fffaf0"/><circle r="88" fill="#f2b544"/><circle r="46" fill="#fffaf0"/><circle r="17" fill="#ed6a4b"/><text y="150" fill="#fffaf0" font-size="23" font-weight="800">SRI LANKA</text></g>
    <g transform="translate(1010 610)"><circle r="115" fill="#fffaf0"/><circle r="88" fill="#bdd9c8"/><rect x="-58" y="-45" width="42" height="90" rx="20" fill="#17352f"/><rect x="8" y="-45" width="42" height="90" rx="20" fill="#17352f"/><text y="150" fill="#fffaf0" font-size="23" font-weight="800">KOREA</text></g>
  </g>
</svg>
